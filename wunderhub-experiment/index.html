  <!-- Antes do CSS: marca .js, liga o teto de 3s (vira modo estático se o main.js não chegar),
       vigia a Anybody (900ms para .fonte-lenta) e marca .economia com saveData. -->
  <script>
  (function () {
    var d = document.documentElement; d.classList.add('js');
    window.__wh = { teto: setTimeout(function () { d.classList.remove('js'); d.classList.add('js-falhou'); }, 3000) };
    if (navigator.connection && navigator.connection.saveData) d.classList.add('economia');
    if (document.fonts && document.fonts.load) {
      var ok = false;
      document.fonts.load('900 100px "Anybody Letreiro"').then(function () { ok = true; d.classList.add('fonte-pronta'); });
      setTimeout(function () { if (!ok) d.classList.add('fonte-lenta'); }, 900);
    }
  })();
  </script>

  <!-- Só a Anybody. No build o href vira a mesma URL com hash usada no fontes.css. -->
