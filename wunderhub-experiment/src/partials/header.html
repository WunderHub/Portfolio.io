<!-- Header sticky (seção 3.4). Frente: topo. Sem JS, "Menu" leva ao #mapa do rodapé; menu.js troca por botão. -->
<header class="header" data-header>
  <div class="header__linha conteudo">
    <a class="wordmark header__marca" href="#topo" aria-label="WunderHub, início">WunderHub</a>
    <nav class="header__nav" aria-label="Principal">
      <ul class="header__lista" role="list">
        <li><a href="#trabalhos">Trabalhos</a></li>
        <li><a href="#servicos">Serviços</a></li>
        <li><a href="#processo">Como trabalho</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
    <div class="header__acoes">
      <a class="header__whatsapp" href="{{whatsappUrl}}" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="24" height="24">
          <path d="M3 4h18v12H10.5L5 20v-4H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M7 8.5h10M7 11.5h6.5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </a>
      <a class="botao header__menu" href="#mapa" data-menu-gatilho>Menu</a>
    </div>
  </div>
</header>
